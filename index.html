<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-Track WAV Audio Player with Seekbar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 600px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #00e676;
    }

    /* Master Play Button */
    .main-controls {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      border: none;
      padding: 12px 35px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #masterPlayBtn {
      background: #00e676;
      color: #121212;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
    }

    #masterPlayBtn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Progress / Seekbar Section */
    .seekbar-container {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #aaa;
    }

    #masterSeekbar {
      width: 100%;
      accent-color: #00e676;
      cursor: pointer;
    }

    /* Track List Section */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .track-card {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-input {
      font-size: 13px;
      color: #ccc;
      max-width: 250px;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .volume-row input[type="range"] {
      width: 100%;
      accent-color: #00e676;
      cursor: pointer;
    }

    .vol-text {
      font-size: 12px;
      width: 40px;
      text-align: right;
      color: #bbb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>6-Track Audio Player</h2>

    <div class="main-controls">
      <button id="masterPlayBtn" class="btn" disabled>▶ Play All</button>
    </div>

    <!-- Master Seekbar (Progress Line) -->
    <div class="seekbar-container">
      <input type="range" id="masterSeekbar" min="0" value="0" step="0.1" disabled>
      <div class="time-info">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>

    <div class="track-list" id="trackList">
      <!-- 6-ti track card JS diye load hobe -->
    </div>
  </div>

  <script>
    const TOTAL_TRACKS = 5;
    const trackList = document.getElementById('trackList');
    const masterPlayBtn = document.getElementById('masterPlayBtn');
    const masterSeekbar = document.getElementById('masterSeekbar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    const tracks = Array.from({ length: TOTAL_TRACKS }, () => ({
      audio: new Audio(),
      isLoaded: false
    }));

    let isPlaying = false;
    let maxDuration = 0;

    // UI toiri kora 6-ti track-er jonno
    for (let i = 0; i < TOTAL_TRACKS; i++) {
      const card = document.createElement('div');
      card.className = 'track-card';

      card.innerHTML = `
        <div class="track-header">
          <strong>Track ${i + 1}</strong>
          <input type="file" class="file-input" accept=".wav,audio/wav,audio/*" data-index="${i}">
        </div>
        <div class="volume-row">
          <span>🔊</span>
          <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="0.8" data-index="${i}">
          <span class="vol-text" id="volText-${i}">80%</span>
        </div>
      `;

      trackList.appendChild(card);
    }

    // File Upload handling
    document.querySelectorAll('.file-input').forEach(input => {
      input.addEventListener('change', (e) => {
        const index = e.target.dataset.index;
        const file = e.target.files[0];

        if (file) {
          const fileURL = URL.createObjectURL(file);
          const audio = tracks[index].audio;
          audio.src = fileURL;
          audio.load();
          tracks[index].isLoaded = true;

          // Track-er length set wae-er jonno wait kora
          audio.addEventListener('loadedmetadata', () => {
            updateMaxDuration();
            checkPlayButtonState();
          });
        }
      });
    });

    // Sub-tracks-er moddhe sobcheye boro Duration khuje ber kora
    function updateMaxDuration() {
      maxDuration = 0;
      tracks.forEach(t => {
        if (t.isLoaded && !isNaN(t.audio.duration)) {
          if (t.audio.duration > maxDuration) {
            maxDuration = t.audio.duration;
          }
        }
      });
      masterSeekbar.max = maxDuration;
      durationEl.innerText = formatTime(maxDuration);
    }

    // Volume Slider handling
    document.querySelectorAll('.vol-slider').forEach(slider => {
      slider.addEventListener('input', (e) => {
        const index = e.target.dataset.index;
        const value = e.target.value;
        tracks[index].audio.volume = value;
        document.getElementById(`volText-${index}`).innerText = `${Math.round(value * 100)}%`;
      });
    });

    // Master Play/Pause Toggle
    masterPlayBtn.addEventListener('click', () => {
      if (!isPlaying) {
        tracks.forEach(t => {
          if (t.isLoaded) t.audio.play();
        });
        masterPlayBtn.innerText = '⏸ Pause All';
        masterPlayBtn.style.background = '#ff5252';
        isPlaying = true;
      } else {
        tracks.forEach(t => {
          if (t.isLoaded) t.audio.pause();
        });
        masterPlayBtn.innerText = '▶ Play All';
        masterPlayBtn.style.background = '#00e676';
        isPlaying = false;
      }
    });

    // Seekbar-e click kore Age/Piche newar jonno code
    masterSeekbar.addEventListener('input', (e) => {
      const seekTime = parseFloat(e.target.value);
      tracks.forEach(t => {
        if (t.isLoaded) {
          t.audio.currentTime = seekTime;
        }
      });
      currentTimeEl.innerText = formatTime(seekTime);
    });

    // Timeline Sync (Audio cholale seekbar r time smoothly sarse emne update hobe)
    tracks[0].audio.addEventListener('timeupdate', () => {
      const activeTrack = tracks.find(t => t.isLoaded);
      if (activeTrack && isPlaying) {
        masterSeekbar.value = activeTrack.audio.currentTime;
        currentTimeEl.innerText = formatTime(activeTrack.audio.currentTime);
      }
    });

    // Time Format function (00:00 convert kora)
    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Button & Seekbar status handle
    function checkPlayButtonState() {
      const hasLoadedTrack = tracks.some(t => t.isLoaded);
      masterPlayBtn.disabled = !hasLoadedTrack;
      masterSeekbar.disabled = !hasLoadedTrack;
    }
  </script>

</body>
</html>
